<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0d1117;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: auto;
    padding-top: 80px;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 35px;
}

.search {
    width: 100%;
    max-width: 650px;
    height: 55px;
    border: none;
    border-radius: 30px;
    padding: 0 25px;
    font-size: 18px;
    outline: none;
    background: #20262e;
    color: white;
}

.buttons {
    margin-top: 45px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}

button {
    background: #20262e;
    color: white;
    border: 1px solid #30363d;
    padding: 15px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-3px);
    background: #30363d;
}

.games {
    margin-top: 60px;
}

.games h2 {
    font-size: 28px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.game {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 15px;
    padding: 35px 10px;
    cursor: pointer;
    transition: 0.2s;
}

.game:hover {
    transform: scale(1.03);
    background: #20262e;
}

footer {
    margin-top: 80px;
    padding-bottom: 30px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <h1>My Hub</h1>

    <input
        class="search"
        id="search"
        placeholder="Search the web..."
        onkeydown="search(event)"
    >

    <div class="buttons">
        <button onclick="openSite('https://google.com')">Google</button>
        <button onclick="openSite('https://youtube.com')">YouTube</button>
        <button onclick="openSite('https://github.com')">GitHub</button>
    </div>

    <div class="games">
        <h2>Games</h2>

        <div class="game-grid">

            <div class="game" onclick="alert('Game 1')">
                🎮 Game 1
            </div>

            <div class="game" onclick="alert('Game 2')">
                🕹️ Game 2
            </div>

            <div class="game" onclick="alert('Game 3')">
                👾 Game 3
            </div>

            <div class="game" onclick="alert('Game 4')">
                🚀 Game 4
            </div>

        </div>
    </div>

    <footer>
        My Website
    </footer>

</div>

<script>
function search(event) {
    if (event.key === "Enter") {
        let query = document.getElementById("search").value;

        if (query.trim() !== "") {
            window.location.href =
                "https://www.google.com/search?q=" +
                encodeURIComponent(query);
        }
    }
}

function openSite(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
